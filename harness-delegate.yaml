apiVersion: v1
kind: Namespace
metadata:
  name: harness

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harness-cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: harness
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Secret
metadata:
  name: aws-devsecops-delegate-account-token
  namespace: harness
type: Opaque
data:
  HARNESS_DELEGATE_TOKEN: "OWRhNzRmZmIwYzQyYmZhYjA4NGFmZTM4ZmUzZjcxOTA="

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    harness.io/name: aws-devsecops-delegate
  name: aws-devsecops-delegate
  namespace: harness
spec:
  replicas: 1
  minReadySeconds: 120
  selector:
    matchLabels:
      harness.io/name: aws-devsecops-delegate
  template:
    metadata:
      labels:
        harness.io/name: aws-devsecops-delegate
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 600
      restartPolicy: Always
      containers:
      - image: us-docker.pkg.dev/gar-prod-setup/harness-public/harness/delegate:3.9.0
        imagePullPolicy: Always
        name: delegate
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        resources:
          limits:
            memory: "1024Mi"
          requests:
            cpu: "0.5"
            memory: "1024Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5
        envFrom:
        - secretRef:
            name: aws-devsecops-delegate-account-token
        env:
        - name: HARNESS_ACCOUNT_ID
          value: bgTzq5eLQD62IeLGT73wJA
        - name: HARNESS_MANAGER_HOST_AND_PORT
          value: https://app.harness.io
        - name: HARNESS_DELEGATE_NAME
          value: aws-devsecops-delegate
        - name: HARNESS_DELEGATE_TAGS
          value: ""
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_SERVICE_ACCOUNT_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: HARNESS_INIT_SCRIPT
          value: ""

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
   name: aws-devsecops-delegate-hpa
   namespace: harness
   labels:
       harness.io/name: aws-devsecops-delegate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aws-devsecops-delegate
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: upgrader-cronjob
  namespace: harness
rules:
  - apiGroups: ["batch", "apps", "extensions"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["extensions", "apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: aws-devsecops-delegate-upgrader-cronjob
  namespace: harness
subjects:
  - kind: ServiceAccount
    name: upgrader-cronjob-sa
    namespace: harness
roleRef:
  kind: Role
  name: upgrader-cronjob
  apiGroup: ""

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrader-cronjob-sa
  namespace: harness

---

apiVersion: v1
kind: Secret
metadata:
  name: aws-devsecops-delegate-upgrader-token
  namespace: harness
type: Opaque
data:
  UPGRADER_TOKEN: "OWRhNzRmZmIwYzQyYmZhYjA4NGFmZTM4ZmUzZjcxOTA="

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-devsecops-delegate-upgrader-config
  namespace: harness
data:
  config.yaml: |
    mode: Delegate
    dryRun: false
    workloadName: aws-devsecops-delegate
    namespace: harness
    containerName: delegate
    delegateConfig:
      accountId: bgTzq5eLQD62IeLGT73wJA
      managerHost: https://app.harness.io

---

apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    harness.io/name: aws-devsecops-delegate-upgrader-job
  name: aws-devsecops-delegate-upgrader-job
  namespace: harness
spec:
  schedule: "0 */1 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 20
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: upgrader-cronjob-sa
          restartPolicy: Never
          containers:
          - image: harness/upgrader:latest
            name: upgrader
            imagePullPolicy: Always
            envFrom:
            - secretRef:
                name: aws-devsecops-delegate-upgrader-token
            volumeMounts:
              - name: config-volume
                mountPath: /etc/config
          volumes:
            - name: config-volume
              configMap:
                name: aws-devsecops-delegate-upgrader-config
