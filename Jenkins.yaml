pipeline {
  agent any
  options { timestamps(); disableConcurrentBuilds() }
  environment {
    AWS_REGION = 'ap-south-1'
    AWS_ACCOUNT_ID = '441931764817'
    ECR_REPOSITORY = 'aws-devsecops-app'
    IMAGE_NAME = 'aws-devsecops-app'
    SNYK_TOKEN = credentials('snyk-token')
  }
  stages {
    stage('Checkout') { steps { checkout scm } }
    stage('Python Build and Test') {
      steps { sh '''
        python3 -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt
        python -m py_compile src/app.py
      ''' }
    }
    stage('Terraform Validation') {
      steps { dir('terraform') { sh '''
        terraform fmt -check -recursive
        terraform init -backend=false
        terraform validate
      ''' } }
    }
    stage('Snyk Security Scan') {
      steps { sh '''
        snyk auth "$SNYK_TOKEN"
        snyk iac test terraform/
        snyk test --file=src/requirements.txt
      ''' }
    }
    stage('Docker Build') { steps { sh 'docker build -t $IMAGE_NAME:$BUILD_NUMBER src/' } }
    stage('Push to ECR') {
      steps { sh '''
        set -eu
        test "$AWS_ACCOUNT_ID" != "REPLACE_WITH_12_DIGIT_ACCOUNT_ID"
        ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
        aws sts get-caller-identity
        aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        docker tag "$IMAGE_NAME:$BUILD_NUMBER" "$ECR_REGISTRY/$ECR_REPOSITORY:$BUILD_NUMBER"
        docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BUILD_NUMBER"
      ''' }
    }
  }
  post {
    always { echo 'Build finished. Review stage logs and scan results.' }
    success { echo 'CI and ECR push completed successfully.' }
    failure { echo 'Pipeline failed. Check Jenkins console output.' }
  }
}
