
pipeline {
  agent any

  options {
    timestamps()
    disableConcurrentBuilds()
  }

  environment {
    AWS_REGION = 'ap-south-1'
    AWS_ACCOUNT_ID = '441931764817'
    ECR_REPOSITORY = 'aws-devsecops-app'
    IMAGE_NAME = 'aws-devsecops-app'

    EKS_CLUSTER_NAME = 'aws-devsecops-eks'
    K8S_NAMESPACE = 'devsecops'
    HELM_RELEASE = 'aws-devsecops-app'

    SNYK_TOKEN = credentials('snyk-token')
  }

  stages {
    stage('Checkout') {
      steps {
        checkout scm
      }
    }

    stage('Python Build and Test') {
      steps {
        sh '''
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          python -m py_compile src/app.py
        '''
      }
    }

    stage('Terraform Validation') {
      steps {
        dir('terraform') {
          sh '''
            terraform fmt -check -recursive
            terraform init -backend=false
            terraform validate
          '''
        }
      }
    }

    stage('Snyk Security Scan') {
      steps {
        sh '''
          snyk auth "$SNYK_TOKEN"
          snyk iac test --severity-threshold=medium terraform/

          . .venv/bin/activate
          python --version
          python -m pip --version

          snyk test --file=src/requirements.txt --package-manager=pip --command=python
        '''
      }
    }

    stage('Docker Build') {
      steps {
        sh 'docker build -t $IMAGE_NAME:$BUILD_NUMBER src/'
      }
    }

    stage('Push to ECR') {
      steps {
        sh '''
          set -eu

          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          aws sts get-caller-identity

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker tag "$IMAGE_NAME:$BUILD_NUMBER" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$BUILD_NUMBER"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BUILD_NUMBER"
        '''
      }
    }

    stage('Deploy to EKS using Helm') {
      steps {
        sh '''
          set -eu

          command -v aws
          command -v kubectl
          command -v helm

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl get nodes

          helm upgrade --install "$HELM_RELEASE" ./helm \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set image.repository="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY" \
            --set image.tag="$BUILD_NUMBER"

          kubectl get deployments -n "$K8S_NAMESPACE"
        '''
      }
    }

    stage('Verify EKS Rollout') {
      steps {
        sh '''
          set -eu

          kubectl rollout status deployment \
            -l app.kubernetes.io/instance="$HELM_RELEASE" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get services -n "$K8S_NAMESPACE"
        '''
      }
    }
  }

  post {
    always {
      echo 'Build finished. Review stage logs and scan results.'
    }

    success {
      echo 'CI, ECR push, and EKS deployment completed successfully.'
    }

    failure {
      echo 'Pipeline failed. Check Jenkins console output.'
    }
  }
}
