global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "aws-devsecops-app"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "aws-devsecops-app.devsecops.svc.cluster.local:5000"
